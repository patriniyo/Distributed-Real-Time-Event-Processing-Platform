spring:
  application:
    name: ingestion-service-test
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

drep:
  kafka:
    enabled: false
  auth:
    enabled: false

ingestion:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac!!
    issuer: drep-ingestion
  default-rate-limit-rps: 100
  tenant-rate-limits:
    tenant-a: 10
  api-keys:
    tenant-a-key: tenant-a
  admin:
    api-key: admin-key
