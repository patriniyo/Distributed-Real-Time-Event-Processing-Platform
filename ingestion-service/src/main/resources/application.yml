server:
  port: 8098
  shutdown: graceful

spring:
  application:
    name: ingestion-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      fail-fast: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

drep:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      raw: events.raw
      processed: events.processed
      dlq: events.dlq
      partitions: 12
      retention-ms: 604800000
      replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    producer:
      acks: all
      retries: 3
  auth:
    enabled: ${DREP_AUTH_ENABLED:true}
    analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8100}
    internal-token: ${DREP_INTERNAL_TOKEN:internal-token}
    legacy-admin-api-key: ${ADMIN_API_KEY:admin-key}

ingestion:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key!!}
    issuer: drep-ingestion
  default-rate-limit-rps: 1000
  tenant-rate-limits:
    tenant-a: 500
    tenant-b: 200
  api-keys:
    tenant-a-key: tenant-a
    tenant-b-key: tenant-b
  admin:
    api-key: ${ADMIN_API_KEY:admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      kafka:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
