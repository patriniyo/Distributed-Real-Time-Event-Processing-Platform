server:
  port: 8098

spring:
  application:
    name: ingestion-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      fail-fast: true

drep:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      raw: events.raw
      processed: events.processed
      dlq: events.dlq
      partitions: 12
      retention-ms: 604800000
      replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    producer:
      acks: all
      retries: 3

ingestion:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-secret-key!!}
    issuer: drep-ingestion
  default-rate-limit-rps: 1000
  tenant-rate-limits:
    tenant-a: 500
    tenant-b: 200
  api-keys:
    tenant-a-key: tenant-a
    tenant-b-key: tenant-b
  admin:
    api-key: ${ADMIN_API_KEY:admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} traceId=%X{traceId} tenantId=%X{tenantId} - %msg%n"
