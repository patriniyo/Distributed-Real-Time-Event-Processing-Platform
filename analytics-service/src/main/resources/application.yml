server:
  port: 8100
  shutdown: graceful

spring:
  application:
    name: analytics-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:drep}
    username: ${POSTGRES_USER:drep}
    password: ${POSTGRES_PASSWORD:drep}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  lifecycle:
    timeout-per-shutdown-phase: 30s

drep:
  analytics:
    kafka:
      processed-topic: events.processed
      consumer-group: analytics-service-group
    cache:
      ttl-seconds: 30
    aggregation:
      flush-interval-ms: 5000
    retention:
      default-days: 90
      cleanup-interval-ms: 86400000
    tenant-retention-days:
      tenant-a: 90
      tenant-b: 90
    admin:
      api-key: ${ADMIN_API_KEY:admin-key}
  auth:
    enabled: ${DREP_AUTH_ENABLED:true}
    legacy-admin-api-key: ${ADMIN_API_KEY:admin-key}
    internal-token: ${DREP_INTERNAL_TOKEN:internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      postgres:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
