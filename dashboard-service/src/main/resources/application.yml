server:
  port: 8101
  shutdown: graceful

spring:
  application:
    name: dashboard-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
  lifecycle:
    timeout-per-shutdown-phase: 30s

drep:
  dashboard:
    api-key: ${ADMIN_API_KEY:admin-key}
    kafka:
      enabled: ${KAFKA_ENABLED:true}
      processed-topic: events.processed
      consumer-group: dashboard-live-feed-group
    services:
      ingestion: ${INGESTION_SERVICE_URL:http://localhost:8098}
      stream-processor: ${STREAM_PROCESSOR_URL:http://localhost:8099}
      analytics: ${ANALYTICS_SERVICE_URL:http://localhost:8100}
    web-socket:
      max-connections: 1000
  auth:
    enabled: ${DREP_AUTH_ENABLED:true}
    analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8100}
    internal-token: ${DREP_INTERNAL_TOKEN:internal-token}
    legacy-admin-api-key: ${ADMIN_API_KEY:admin-key}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      upstream:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
