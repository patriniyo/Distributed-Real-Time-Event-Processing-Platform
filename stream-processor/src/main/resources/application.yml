server:
  port: 8099

spring:
  application:
    name: stream-processor
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3

drep:
  processor:
    schema-version: 1
    tenant-tiers:
      tenant-a: premium
      tenant-b: standard
    idempotency:
      enabled: ${REDIS_ENABLED:true}
      ttl-hours: 24
    replay:
      group-id-prefix: replay
      max-records: 10000
  kafka:
    topics:
      raw: events.raw
      processed: events.processed
      dlq: events.dlq
    raw-consumer:
      group-id: stream-processor-group
    processed-consumer:
      group-id: processed-analytics-group
    retry:
      max-attempts: 3
      initial-backoff-ms: 1000
      backoff-multiplier: 2.0
    lag-monitor:
      alert-threshold: 10000
      check-interval-ms: 30000
    admin:
      api-key: ${ADMIN_API_KEY:admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        drep.processing.latency: true

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
