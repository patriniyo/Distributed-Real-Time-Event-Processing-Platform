server:
  port: 8099
  shutdown: graceful

spring:
  application:
    name: stream-processor
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3
  lifecycle:
    timeout-per-shutdown-phase: 30s

drep:
  processor:
    schema-version: 1
    tenant-tiers:
      tenant-a: premium
      tenant-b: standard
    idempotency:
      enabled: ${REDIS_ENABLED:true}
      ttl-hours: 24
    replay:
      group-id-prefix: replay
      max-records: 10000
  kafka:
    topics:
      raw: events.raw
      processed: events.processed
      dlq: events.dlq
    raw-consumer:
      group-id: stream-processor-group
    processed-consumer:
      group-id: processed-analytics-group
    retry:
      max-attempts: 3
      initial-backoff-ms: 1000
      backoff-multiplier: 2.0
    lag-monitor:
      alert-threshold: 10000
      check-interval-ms: 30000
    admin:
      api-key: ${ADMIN_API_KEY:admin-key}
  auth:
    enabled: ${DREP_AUTH_ENABLED:true}
    analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8100}
    internal-token: ${DREP_INTERNAL_TOKEN:internal-token}
    legacy-admin-api-key: ${ADMIN_API_KEY:admin-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        drep.processing.latency: true
    tags:
      service: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      kafka:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
